<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <!-- 指定入口白名單（Store Gate）：喺 React 掛載前先判斷來源，唔會先閃一閃紀錄冊 -->
    <script src="/store_gate_v1.0.js"></script>
    <script>
      // 本機開發（localhost／127.0.0.1）用 'open'，避免開發時被自己的閘擋住；
      // 其餘（Vercel Production／Preview）一律 'entry-gate'。
      var localDev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      if (typeof initStoreGate === 'function') {
        initStoreGate({
          appKey: 'scoutbook',
          mode: localDev ? 'open' : 'entry-gate',
          // 唯一公開入口 = APP STORE。APP STORE 一落架，普通人就全部入唔到（呢個就係關站開關）。
          // 成員系統係唯一例外：本身公開、又內置四本 BOOK，成員唔會冇路入；但卡上唔提、唔畫掣
          // （silent = 照放行但唔顯示），免得白名單卡教普通人「可以由成員系統入」。
          portalIds: ['appstore'],
          silentPortalIds: ['member'],
          // SG11-a：已加入主畫面嘅用戶、以及直接開網址嘅現有用戶照用（唔會鎖死自己嘅紀錄）。
          allowStandalone: true,
          autoRedirectSeconds: 0,
          // 卡片文案用治理倉預設（SG19 簡短人話版），同其他 App 一致，唔加自訂字句。
          // 落架後撳「前往 APP STORE」都搵唔到呢個 App，普通人自然入唔到。
        });
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="copyright" content="© SCOUT SYSTEM" />
    <meta name="app-version" content="v2.2.0" />
    <meta name="application-name" content="SCOUTBOOK" />
    <meta
      name="description"
      content="SCOUTBOOK — 童軍個人隨身離線電子紀錄冊（v2.2.0）。逐頁對應《童軍紀錄冊》第 1–110 頁、附錄及 2026 年童軍訓練綱要，支援手寫簽名、PT/18・P120A1・P120A2 自動填表列印與離線二維碼核簽。"
    />
    <title>SCOUTBOOK · 童軍紀錄冊 v2.2.0</title>

    <!-- G11 圖標標準：5 條 link + 4 條 meta，全部 PNG／ICO（不准 SVG） -->
    <link rel="icon" href="/icons/favicon-v2.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16-v2.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#143b28" />
    <meta name="msapplication-TileColor" content="#143b28" />
    <meta property="og:title" content="SCOUTBOOK · 童軍電子紀錄冊" />
    <link rel="canonical" href="https://scoutbook-five.vercel.app/" />
    <meta
      property="og:description"
      content="逐頁對應《童軍紀錄冊》第 1–110 頁、一鍵生成 PT/18・P120A1・P120A2 官方表格、純離線二維碼核簽與 scoutbadge 進度互通。"
    />
    <meta property="og:url" content="https://scoutbook-five.vercel.app/" />
    <meta property="og:image" content="https://scoutbook-five.vercel.app/icons/og-image-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SCOUTBOOK" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      window.APP_VERSION = 'v2.2.0';
      try {
        var savedLang = localStorage.getItem('scoutbook.lang');
        document.documentElement.setAttribute('data-lang', savedLang === 'en' ? 'en' : 'zh');
      } catch (e) {
        document.documentElement.setAttribute('data-lang', 'zh');
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div
        id="app-boot"
        style="padding:24px;min-height:100dvh;color:#f6e6bb;background:#143b28;font-family:system-ui,sans-serif;text-align:center"
      >
        SCOUTBOOK v2.2.0 · 童軍電子紀錄冊
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
